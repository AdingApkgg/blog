# 主题界面文案的三语对照（只用于导航菜单与侧边栏统计数字旁边那几个词）。
#
# 键 = 中文原文，必须与 `_config.butterfly.yml` 的 menu 配置里写的文字**完全一致**；
# 换了菜单文字，这里要跟着改，否则该菜单项在日英页面上会保持中文。
#
# 只替换 butterfly 特定 class 容器里的文字（site-page / headline），
# 不会碰文章正文，所以词表可以放心收窄。

