- date: 2026-10-31 07:12:00
  key: ss-20261031-0712
  tags:
    - 记录
  content: |
    一周里写了十二篇复盘，全是拿近期提交对着原文重写的。最大的收获不是文章，是发现有三处我一直以为自己记得很清楚、一对源码全错：行数、耗时、还有一次「相隔两天」其实是八分钟。

    记性真靠不住，尤其对自己刚做过的事。

- date: 2026-10-31 06:40:00
  key: ss-20261031-0640
  tags:
    - 博客
  content: |
    把项目页和说说页一起翻了。项目页原来只有名字、一句介绍和一张图，看着像作品集的目录页；现在补了标签、源码入口和「前往」，截图也全部重拍了，用 chromium 在构建机上逐站抓的，两倍像素，2880×1800 压成 AVIF 大概两三百 KB 一张。

    sakuraav 那张有年龄门，脚本里点了「我已年满 18 岁，进入」才截到正经首页。

- date: 2026-10-30 23:18:00
  key: ss-20261030-2318
  tags:
    - 构建机
  content: |
    清了一轮 `~/.local/state/ai-jobs`，372 个目录、3.1 GB。每个目录里都躺着一个 `run.sh`、一份 `job.log` 和一个 `exit.code`——任务早结束了，日志还在。

    这个设计当初是为了断线以后能查，现在倒成了「谁还敢删」的理由。加了个按天清理的 cron，只删有 `exit.code` 的。

- date: 2026-10-29 21:02:00
  key: ss-20261029-2102
  tags:
    - 前端
  content: |
    Service Worker 这种东西最烦的地方不是写，是撤。用户浏览器里装的旧 worker 会一直拦请求，你部署新代码它也不一定换。

    处理办法是往原来那个地址发一个什么也不做的退役 worker：装好、接管、只删自己那九个缓存、删干净再把自己注销掉，中途失败就留着下次重试。不碰 IndexedDB，不发 Clear-Site-Data。

- date: 2026-10-28 14:35:00
  key: ss-20261028-1435
  tags:
    - 数据库
  content: |
    迁移脚本开头先把锁拿满，然后再改结构。「拿不到锁就快速失败」听着对，实际是拿线上停机换的：`docker compose up -d` 不会因为 migrate 退出非零就保住旧容器，照样重建，新容器卡在 Created，站点直接下线。

    所以现在是两秒短超时、重试三十次。

- date: 2026-10-27 20:50:00
  key: ss-20261027-2050
  tags:
    - 事故
  content: |
    一次没有冲突的 merge，把 292 行广告归因代码静默删掉了。typecheck 是绿的，CI 是绿的，因为同一批提交也把引用一起删了 —— 编译器当然不会有意见。

    合并以后按功能名 grep 一遍。这条现在写进规矩里了。

- date: 2026-10-26 19:40:00
  key: ss-20261026-1940
  tags:
    - 性能
  content: |
    统计接口慢不是索引的问题。`count(DISTINCT ...) FILTER (...)` 里的那个 EXISTS，规划器会给每一条已经筛出来的行跑一次子计划，三十天窗口下是二十三万次索引探查。

    把这个条件挪进独立标量子查询的 WHERE，规划器自己就选 hash semi join 了。funnel 1.51 秒掉到 0.64 秒，结果逐字节一样。

- date: 2026-10-25 11:20:00
  key: ss-20261025-1120
  tags:
    - 瞎想
  content: |
    八条线同时跑的时候，真正稀缺的不是打字速度，是「哪条线现在可以继续往前走」这个判断。代理可以同时写八个文件，但决定谁先谁后、谁的改动会不会踩到谁，得我自己来。

    并行化的是判断，不是打字。这句大概是今年想得最清楚的一句。

- date: 2026-10-23 22:05:00
  key: ss-20261023-2205
  tags:
    - 网络
  content: |
    服务器在隧道后面，进来的请求是 http，框架就老老实实按 http 生成 origin。cookie 的 secure、跳转地址、回调 URL 全变成 http 的。

    包一层 `publicRequest`，只认自己配的公开域名，把协议和主机还原回去，正文、Cookie、查询串原样保留。别的 Host 带来的 `x-forwarded-host` 一律不信。

- date: 2026-10-21 16:48:00
  key: ss-20261021-1648
  tags:
    - 折腾
  content: |
    给构建机上的任务全换成 tmux 加持久目录：独立会话名、`run.sh` 落盘、日志和退出码都写文件。断开 SSH 回来还能接着看，而不是对着一句「连接已断开」猜它到底跑没跑完。

    麻烦，但比重新跑一遍有副作用的命令便宜。

- date: 2026-10-18 13:15:00
  key: ss-20261018-1315
  tags:
    - 记录
  content: |
    第一次同时开五条不相干的活：一个改 Rust、一个调前端、一个写迁移、一个跑收录脚本、一个写文档。到下午发现真正的问题是写集重叠 —— 两个代理改了同一个文件，以为什么都没发生。

    后来给每个任务先写清楚「只碰这些路径」。

- date: 2026-10-07 22:35:00
  key: ss-20261007-2235
  tags:
    - 开张
  content: |
    首条说说。

    这里大概会记一些不适合单独成篇的碎片：今天改了什么、卡在哪、哪个想当然错了。没什么用，就是不想让这些东西只留在提交信息里。
